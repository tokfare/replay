name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify asset checksum
        run: cd dist && sha256sum -c replay.html.sha256
      - name: Release notes (this tag's section only)
        run: |
          awk -v tag="$GITHUB_REF_NAME" 'index($0, "## " tag " ") == 1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" dist/replay.html dist/replay.html.sha256 --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
  labels:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ensure issue-form label exists
        run: gh label create "pricing-question" --repo "$GITHUB_REPOSITORY" --color 1d76db --description "Question about token, credit, or per-task pricing" --force
        env:
          GH_TOKEN: ${{ github.token }}
